# Flor de Sal — Dependabot configuration
# Actualizaciones semanales de dependencias pip y GitHub Actions

version: 2
updates:
  # ----------------------------------------------------------------------
  # Dependencias Python (pip)
  # ----------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    groups:
      # Agrupa actualizaciones de testing/dev tools
      dev-tools:
        patterns:
          - "pytest*"
          - "ruff"
          - "mypy"
          - "hypothesis"
          - "types-*"
        update-types: ["minor", "patch"]
      # Agrupa actualizaciones de runtime (streamlit, pandas, numpy, etc.)
      runtime:
        patterns:
          - "streamlit"
          - "pandas"
          - "numpy"
          - "scipy"
          - "plotly"
          - "requests"
          - "pyyaml"
        update-types: ["minor", "patch"]

  # ----------------------------------------------------------------------
  # GitHub Actions
  # ----------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "deps(gha)"
      include: "scope"