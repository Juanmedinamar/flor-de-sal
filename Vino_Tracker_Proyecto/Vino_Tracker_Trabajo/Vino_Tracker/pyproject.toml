[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vino-tracker"
version = "1.0.0"
description = "Aplicación para consultar y comparar precios de vinos en supermercados y tiendas online"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Tu Nombre", email = "tu@email.com"}
]
keywords = ["vinos", "precios", "scraping", "comparador", "supermercados"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "streamlit>=1.62.0",
    "pandas>=3.0.5",
    "requests>=2.34.2",
    "beautifulsoup4>=4.15.0",
    "playwright>=1.62.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
    "flake8>=6.0",
]

[project.scripts]
vino-tracker = "app:main"

[tool.setuptools]
packages = ["scrapers"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
