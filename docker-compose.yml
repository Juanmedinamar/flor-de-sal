# Flor de Sal — docker-compose.yml (dev + prod override)
# Dev:  docker compose up -d
# Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: flor-de-sal:latest
    container_name: flor-de-sal-app
    ports:
      - "8501:8501"
    volumes:
      # Persistencia de la base de datos SQLite
      - ./data:/app/data
      # Persistencia de backups
      - ./backups:/app/backups
      # Opcional: montar config.yaml para overrides en dev
      - ./config.yaml:/app/config.yaml:ro
    env_file:
      - .env          # opcional: variables de entorno (p.ej. FLOR_DESAL_DB)
    environment:
      # Configuración por defecto (sobrescribible por .env)
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "scripts/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    # Logging driver (opcional: json-file con rotación)
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ----------------------------------------------------------------------
# Networks (opcional: aislar en red propia)
# ----------------------------------------------------------------------
networks:
  default:
    name: flor-de-sal-network